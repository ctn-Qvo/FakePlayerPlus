name: 构建与发布

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 版本号（如 v1.0.0）
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: 构建并上传
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: 赋予 gradlew 可执行权限
        run: chmod +x gradlew

      - name: 构建项目
        run: ./gradlew build -x test
        env:
          APP_VERSION: ${{ inputs.version || github.ref_name }}

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          files: build/libs/*.jar
